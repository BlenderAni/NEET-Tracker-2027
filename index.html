<!doctype html>
<html>
  <head>
    <title>NEET Tracker</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <div class="header">
      <div class="top-bar">
        <h1 id="title"></h1>

        <span class="exam-date"> 🎯 Target: 02 May 2027 </span>
      </div>

      <div id="daysLeft" class="days-left">278 DAYS LEFT</div>
    </div>

    <!-- ================= QUICK STATS ================= -->

    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-icon">📅</div>

        <div class="stat-title">Days Left</div>

        <div class="stat-value" id="daysStat">278</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">⏱</div>

        <div class="stat-title">Study Time</div>

        <div class="stat-value" id="studyHoursStat">0h</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">🔥</div>

        <div class="stat-title">Streak</div>

        <div class="stat-value" id="streakStat">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">📚</div>

        <div class="stat-title">Sessions</div>

        <div class="stat-value" id="sessionsStat">0</div>
      </div>
    </div>

    <!-- ================= DASHBOARD ================= -->

    <div class="dashboard">
      <!-- JOURNAL -->

      <div class="notes-card">
        <div class="notes-header">
          <h2>📖 Study Journal</h2>

          <button class="add-btn" id="newNoteBtn">+</button>
        </div>

        <div id="notesList" class="notes-list">
          <div class="empty-note">No journal entries yet.</div>
        </div>

        <div id="noteEditor" class="note-editor">
          <input type="date" id="noteDate" />

          <input type="text" id="noteTitle" placeholder="Title..." />

          <textarea
            id="noteContent"
            maxlength="120000"
            placeholder="Write what you studied today..."
          ></textarea>

          <button id="saveNote" class="save-btn">Save Note</button>

          <button id="deleteNote" class="delete-btn">Delete Note</button>
        </div>
      </div>

      <!-- CALENDAR -->

      <div class="calendar-card">
        <div class="calendar-header">
          <button id="prevMonth" class="month-btn">❮</button>

          <h2 id="monthTitle">July 2026</h2>

          <button id="nextMonth" class="month-btn">❯</button>
        </div>

        <div class="days">
          <div>Sun</div>
          <div>Mon</div>
          <div>Tue</div>
          <div>Wed</div>
          <div>Thu</div>
          <div>Fri</div>
          <div>Sat</div>
        </div>

        <div class="dates" id="dates"></div>
      </div>
    </div>

    <!-- ================= STUDY TIME BUTTON ================= -->

    <div class="time-section">
      <button id="timeButton">
        <span class="time-icon"> ⏱ </span>

        <span class="time-title"> Study Time </span>

        <span class="time-subtitle"> Continue today's study session </span>
      </button>
    </div>
    
    <script src="studydata.js"></script>
    <script src="script.js"></script>
  </body>
</html>
